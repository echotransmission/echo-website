<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A signal from what comes next.">
  <meta name="theme-color" content="#1a2620">
  <title>Echo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #1a2620;
      color: #f5ecd9;
      font-family: 'Fraunces', Georgia, serif;
      overflow-x: hidden;
    }
    body {
      position: relative;
      min-height: 100vh;
    }

    /* The field — dual-layer atmosphere for the misted-gradient warming.
       The cool layer (cooler misted forest green) holds full opacity throughout.
       The warm layer (subtly warmer green, ~10 RGB units) eases in across the
       page, warming the field by the time the visitor reaches the seventh,
       and easing slightly back through Subscribe and footer.
       The warming is imperceptible — the body registers it before the mind names it. */
    .field-continuous {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 8%  at 50% 4%,  rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 25% 12%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 70% 20%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 80% 8%  at 30% 28%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 65% 36%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 35% 44%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 80% 8%  at 70% 52%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 30% 60%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 65% 68%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 80% 8%  at 35% 76%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 70% 84%, rgba(95, 125, 110, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 30% 92%, rgba(95, 125, 110, 0.07) 0%, transparent 70%);
    }
    /* Warm-field overlay — same gradient pattern in slightly warmer tone.
       The body element gets an inline --warm-field-opacity that is updated by
       JS as the visitor scrolls. Default is 0 (cool). */
    .field-warm {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.4s linear;
      background:
        radial-gradient(ellipse 80% 8%  at 50% 4%,  rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 25% 12%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 70% 20%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 80% 8%  at 30% 28%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 65% 36%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 35% 44%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 80% 8%  at 70% 52%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 30% 60%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 65% 68%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 80% 8%  at 35% 76%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 70% 8%  at 70% 84%, rgba(120, 130, 100, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 75% 8%  at 30% 92%, rgba(120, 130, 100, 0.08) 0%, transparent 70%);
    }
    /* Backstop body warming — a subtle solid-color shift that does the heavy
       lifting on the imperceptible warming. RGB ~8-12 units warmer at full. */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: rgba(38, 42, 30, 0.6);
      opacity: var(--warm-field-opacity, 0);
      transition: opacity 0.4s linear;
      mix-blend-mode: soft-light;
    }

    /* Opening sequence stage — the first viewport */
    .echo-stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      z-index: 1;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: radial-gradient(rgba(255,255,255,0.5) 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      z-index: 60;
    }

    /* The bioluminescent signal — five layered radial gradients */
    .signal-wrap {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 1px;
      height: 1px;
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
    }
    .signal {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      filter: blur(40px);
      mix-blend-mode: screen;
    }
    .sig-outer-blue {
      width: 1100px; height: 1100px;
      background: radial-gradient(circle, rgba(30, 110, 145, 0.45) 0%, rgba(30, 110, 145, 0.20) 35%, rgba(30, 110, 145, 0.08) 60%, transparent 78%);
      filter: blur(60px);
      animation: arriveOuter 7s cubic-bezier(0.22, 0.61, 0.36, 1) 0s forwards, breatheOuter 7.5s ease-in-out 7.5s infinite;
    }
    .sig-deep {
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(20, 110, 135, 0.65) 0%, rgba(20, 110, 135, 0.25) 40%, rgba(20, 110, 135, 0.08) 65%, transparent 80%);
      filter: blur(45px);
      animation: arriveDeep 7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s forwards, breatheDeep 6.5s ease-in-out 7.5s infinite;
    }
    .sig-mid {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(70, 175, 195, 0.6) 0%, rgba(70, 175, 195, 0.18) 50%, transparent 78%);
      filter: blur(28px);
      animation: arriveMid 7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.3s forwards, breatheMid 5.5s ease-in-out 7.8s infinite;
    }
    .sig-glacier {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(150, 225, 235, 0.75) 0%, rgba(150, 225, 235, 0.18) 55%, transparent 82%);
      filter: blur(20px);
      animation: arriveGlacier 7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.5s forwards, breatheGlacier 5.5s ease-in-out 8.2s infinite;
    }
    .sig-core {
      width: 100px; height: 100px;
      background: radial-gradient(circle, rgba(210, 245, 250, 0.9) 0%, rgba(210, 245, 250, 0.35) 50%, transparent 82%);
      filter: blur(10px);
      animation: arriveCore 7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.8s forwards, breatheCore 5.5s ease-in-out 8.5s infinite;
    }

    @keyframes arriveOuter {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.05); }
      30%  { opacity: 0.4; transform: translate(-50%, -50%) scale(0.4); }
      70%  { opacity: 0.7; transform: translate(-50%, -50%) scale(0.85); }
      100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes arriveDeep {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.05); }
      20%  { opacity: 0.4; transform: translate(-50%, -50%) scale(0.25); }
      60%  { opacity: 0.75; transform: translate(-50%, -50%) scale(0.7); }
      100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes arriveMid {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.05); }
      20%  { opacity: 0.35; transform: translate(-50%, -50%) scale(0.3); }
      60%  { opacity: 0.7; transform: translate(-50%, -50%) scale(0.75); }
      100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes arriveGlacier {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.05); }
      30%  { opacity: 0.45; transform: translate(-50%, -50%) scale(0.4); }
      70%  { opacity: 0.9; transform: translate(-50%, -50%) scale(0.85); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes arriveCore {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
      40%  { opacity: 0.45; transform: translate(-50%, -50%) scale(0.5); }
      80%  { opacity: 0.9; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes breatheOuter {
      0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 0.6; transform: translate(-50%, -50%) scale(1.05); }
    }
    @keyframes breatheDeep {
      0%, 100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 0.7; transform: translate(-50%, -50%) scale(1.06); }
    }
    @keyframes breatheMid {
      0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 0.6; transform: translate(-50%, -50%) scale(1.08); }
    }
    @keyframes breatheGlacier {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 0.75; transform: translate(-50%, -50%) scale(1.04); }
    }
    @keyframes breatheCore {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* The opening line */
    .opening-line {
      position: absolute;
      left: 50%;
      top: 64%;
      transform: translate(-50%, 0);
      width: min(820px, 88%);
      text-align: center;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 300;
      font-size: clamp(22px, 3vw, 36px);
      line-height: 1.55;
      letter-spacing: 0.005em;
      color: #f5ecd9;
      z-index: 4;
      margin: 0;
      pointer-events: none;
      text-shadow: 0 0 30px rgba(245, 180, 80, 0.08);
    }
    .opening-line .word {
      display: inline-block;
      opacity: 0;
      filter: blur(6px);
      transform: translateY(6px);
      margin-right: 0.22em;
      animation-fill-mode: forwards;
    }
    .opening-line .w1 { animation: emerge 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) 3.2s forwards; }
    .opening-line .w2 { animation: emerge 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) 3.8s forwards; }
    .opening-line .w3 { animation: emerge 1.8s cubic-bezier(0.22, 0.61, 0.36, 1) 4.4s forwards; }
    @keyframes emerge {
      0%   { opacity: 0; filter: blur(6px); transform: translateY(6px); }
      100% { opacity: 0.92; filter: blur(0); transform: translateY(0); }
    }

    /* The scroll hint */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.4em;
      text-transform: lowercase;
      color: rgba(245, 236, 217, 0.32);
      opacity: 0;
      z-index: 5;
      pointer-events: none;
      animation: hintArrive 2s ease-out 5.8s forwards, hintBreathe 4s ease-in-out 8.6s infinite;
    }
    @keyframes hintArrive { to { opacity: 1; } }
    @keyframes hintBreathe {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 0.3; }
    }

    /* The navigation mark — three stacked dots */
    .nav-mark {
      position: fixed;
      top: 30px;
      right: 36px;
      width: 28px;
      height: 36px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      opacity: 0.5;
      transition: opacity 0.6s ease-out, gap 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .nav-mark:hover,
    .nav-mark:focus-visible {
      opacity: 1;
      gap: 7px;
      outline: none;
    }
    .nav-mark .nav-dot {
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(245, 236, 217, 0.65);
      transition: background 1.4s ease-out, box-shadow 1.4s ease-out, transform 0.4s ease-out;
    }
    .nav-mark .nav-dot-1 { animation: dotPulse 3s ease-in-out 0.6s infinite; }
    .nav-mark .nav-dot-2 { animation: dotPulse 3s ease-in-out 0.85s infinite; }
    .nav-mark .nav-dot-3 { animation: dotPulse 3s ease-in-out 1.1s infinite; }
    @keyframes dotPulse {
      0%, 90%, 100% { transform: scale(1); opacity: 0.65; }
      10%           { transform: scale(1.5); opacity: 1; }
      25%           { transform: scale(1); opacity: 0.65; }
    }
    .nav-mark.seeded .nav-dot {
      background: rgba(180, 235, 245, 0.95);
      box-shadow: 0 0 10px rgba(150, 225, 235, 0.7);
    }
    .nav-mark.seeded {
      opacity: 1;
      animation: navBreathe 5.5s ease-in-out infinite;
    }
    .nav-mark.seeded .nav-dot-1 { animation: dotPulseSeeded 3s ease-in-out 0s infinite; }
    .nav-mark.seeded .nav-dot-2 { animation: dotPulseSeeded 3s ease-in-out 0.25s infinite; }
    .nav-mark.seeded .nav-dot-3 { animation: dotPulseSeeded 3s ease-in-out 0.5s infinite; }
    .nav-mark.receiving .nav-dot-1 { animation: dotReceive 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0s 1; }
    .nav-mark.receiving .nav-dot-2 { animation: dotReceive 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.18s 1; }
    .nav-mark.receiving .nav-dot-3 { animation: dotReceive 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.36s 1; }
    @keyframes dotPulseSeeded {
      0%, 90%, 100% { transform: scale(1); opacity: 0.85; }
      10%           { transform: scale(1.6); opacity: 1; box-shadow: 0 0 16px rgba(150, 225, 235, 0.95); }
      25%           { transform: scale(1); opacity: 0.85; }
    }
    @keyframes dotReceive {
      0%   { transform: scale(1); opacity: 0.95; }
      30%  { transform: scale(2); opacity: 1; box-shadow: 0 0 20px rgba(180, 235, 245, 1); }
      100% { transform: scale(1); opacity: 0.95; }
    }
    @keyframes navBreathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.7; }
    }

    /* The navigation panel — cursor-proximity expansion with staggered cascade.
       Hovering the nav-mark (or approaching within ~60-80px) reveals the panel.
       Each item appears with 80-120ms stagger. Items have subtle amber warming
       on hover with ~1.05 scale. The panel is generous in its welcome —
       Echo welcomes those who reach. */
    .nav-panel {
      position: fixed;
      top: 76px;
      right: 36px;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .nav-panel.open {
      opacity: 1;
      pointer-events: auto;
    }
    .nav-item {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: rgba(245, 236, 217, 0.75);
      background: transparent;
      border: none;
      padding: 4px 2px;
      cursor: pointer;
      text-decoration: none;
      opacity: 0;
      transform: translateX(8px);
      transition:
        opacity 0.28s cubic-bezier(0.22, 0.61, 0.36, 1),
        transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1),
        color 0.4s ease-out,
        text-shadow 0.4s ease-out;
      will-change: opacity, transform;
    }
    .nav-panel.open .nav-item {
      opacity: 1;
      transform: translateX(0);
    }
    /* Staggered cascade — 100ms between items */
    .nav-panel.open .nav-item:nth-child(1) { transition-delay: 0ms; }
    .nav-panel.open .nav-item:nth-child(2) { transition-delay: 100ms; }
    .nav-panel.open .nav-item:nth-child(3) { transition-delay: 200ms; }
    .nav-panel.open .nav-item:nth-child(4) { transition-delay: 300ms; }
    /* Reverse stagger on close — items go in roughly together */
    .nav-panel:not(.open) .nav-item { transition-delay: 0ms; }
    .nav-item:hover,
    .nav-item:focus-visible {
      color: #f6dcaa;
      text-shadow: 0 0 14px rgba(246, 220, 170, 0.35);
      transform: translateX(0) scale(1.05);
      outline: none;
    }
    .nav-panel.open .nav-item:hover,
    .nav-panel.open .nav-item:focus-visible {
      transform: translateX(0) scale(1.05);
    }

    /* The Sol thread — quiet line of text inviting the visitor to meet Sol.
       Used at top of first viewport AND in the footer. Same low-opacity register
       as the scroll hint, breathing offset half a cycle. Hover slightly grows the
       text and warms its color, signaling clickability without being loud. */
    .sol-thread {
      position: absolute;
      right: 56px;
      bottom: 40px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.4em;
      text-transform: lowercase;
      color: rgba(245, 236, 217, 0.55);
      background: transparent;
      border: none;
      padding: 4px 6px;
      cursor: pointer;
      opacity: 0;
      z-index: 5;
      animation: hintArrive 2s ease-out 5.8s forwards, threadBreathe 4s ease-in-out 10.6s infinite;
      transition: color 0.4s ease-out, text-shadow 0.4s ease-out, transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1), letter-spacing 0.4s ease-out;
      transform-origin: center center;
      display: inline-block;
    }
    /* Half-cycle offset from scroll hint — they breathe out of phase */
    @keyframes threadBreathe {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }
    .sol-thread:hover,
    .sol-thread:focus-visible {
      color: rgba(246, 220, 170, 0.95);
      text-shadow: 0 0 14px rgba(246, 220, 170, 0.4);
      transform: scale(1.08);
      letter-spacing: 0.42em;
      outline: none;
    }
    /* The footer Sol thread — same character, but sits inline in the footer
       layout rather than absolutely-positioned at the bottom of a viewport.
       No fade-in animation needed; it's revealed by scroll. */
    .sol-thread-footer {
      position: relative;
      right: auto;
      bottom: auto;
      opacity: 1;
      animation: threadBreathe 4s ease-in-out infinite;
      margin: 0 0 22px;
    }

    /* The two orbs */
    .orb {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      opacity: 0;
    }
    .orb-up {
      position: fixed;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, rgba(220, 245, 250, 1) 0%, rgba(180, 235, 245, 0.85) 35%, rgba(150, 225, 235, 0.45) 65%, transparent 90%);
      filter: blur(2px);
      box-shadow: 0 0 32px rgba(180, 235, 245, 1), 0 0 60px rgba(180, 235, 245, 0.55);
      z-index: 200;
      will-change: transform, opacity;
      transform: translate3d(-100px, -100px, 0);
    }
    .orb-down {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, rgba(225, 248, 252, 1) 0%, rgba(190, 240, 248, 0.75) 30%, rgba(160, 228, 240, 0.35) 60%, transparent 88%);
      filter: blur(3px);
      box-shadow: 0 0 44px rgba(180, 235, 245, 0.85);
      z-index: 50;
    }
    .orb-down.alive {
      animation: orbPulse 2.6s ease-in-out infinite;
    }
    /* When the orb-down has settled at the seventh — it grows visibly,
       glow becomes brighter, breathing slows. Seamless transition back to
       wandering size when the visitor scrolls up past the seventh. */
    .orb-down.settled {
      animation: orbPulseSettled 3.6s ease-in-out infinite;
    }
    @keyframes orbPulseSettled {
      0%, 100% {
        transform: scale(1.6);
        box-shadow: 0 0 70px rgba(200, 245, 252, 1), 0 0 130px rgba(180, 235, 245, 0.55);
        filter: blur(2.5px);
      }
      50% {
        transform: scale(1.85);
        box-shadow: 0 0 100px rgba(220, 250, 255, 1), 0 0 170px rgba(200, 245, 252, 0.7);
        filter: blur(2px);
      }
    }
    /* When the orb-down has arrived at Subscribe — slightly smaller settled
       state, since the form area is more intimate than the seventh's threshold.
       Recognition pulse fires when the visitor submits the form. */
    .orb-down.subscribed {
      animation: orbPulseSubscribed 3.4s ease-in-out infinite;
    }
    @keyframes orbPulseSubscribed {
      0%, 100% {
        transform: scale(1.25);
        box-shadow: 0 0 50px rgba(200, 245, 252, 0.85), 0 0 90px rgba(180, 235, 245, 0.4);
        filter: blur(2.5px);
      }
      50% {
        transform: scale(1.4);
        box-shadow: 0 0 70px rgba(220, 250, 255, 0.95), 0 0 120px rgba(200, 245, 252, 0.55);
        filter: blur(2px);
      }
    }
    .orb-down.recognition {
      animation: orbRecognition 1.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    @keyframes orbRecognition {
      0%   { transform: scale(1.25); box-shadow: 0 0 50px rgba(200, 245, 252, 0.85); }
      30%  { transform: scale(2.1); box-shadow: 0 0 100px rgba(220, 250, 255, 1); }
      100% { transform: scale(1.25); box-shadow: 0 0 50px rgba(200, 245, 252, 0.85); }
    }
    @keyframes orbPulse {
      0%, 100% {
        transform: scale(1);

    /* The dissolve transition */
    .dissolving .signal-wrap { animation: signalContract 1.2s cubic-bezier(0.55, 0.05, 0.4, 1) forwards; }

    @keyframes lineFade {

    .returning .signal-wrap { animation: signalReturn 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
    .returning .opening-line { animation: lineReturn 0.9s ease-out 0.3s forwards; }
    .returning .scroll-hint { animation: lineReturn 0.5s ease-out 0.6s forwards; }
    @keyframes signalReturn {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    @keyframes lineReturn {
      0%   { opacity: 0; filter: blur(4px); }

    /* The six glimpses — Session C
       Order: rhythms (G1), love (G2), creativity (G3), presence (G4),

    .glimpses {
      position: relative;
      z-index: 1;

      min-height: 3360px;
      padding: 60px 0 80px;

    .ebubble {
      position: absolute;
      width: 480px;
      height: 480px;
      margin-left: -240px;
      margin-top: -240px;

      z-index: 2;
      transition: transform 0.32s cubic-bezier(0.55, 0.05, 0.4, 1);
      transform: scale(0.42);
      transform-origin: center center;
    }
    .ebubble.expanded {
      z-index: 10;
      transform: scale(1);
      transition: transform 0.75s cubic-bezier(0.22, 0.61, 0.36, 1);

    .ebubble svg { width: 100%; height: 100%; display: block; overflow: visible; }

    /* Field temperatures, in the new order:

       3 movement and creativity — motion-warm oranges
       4 presence and consciousness — silver-white

       6 sovereignty and AI collaboration — steel-cyan */
    .ebubble[data-glimpse="1"] { --c: 232,178,92;  --img-warm: 252,205,118; --img-mid: 196,138,62;  --img-deep: 72,46,22;  --name: rgba(252,225,182,0.92); --inv: #f6dcaa; --cyc: 7.5s; }
    .ebubble[data-glimpse="2"] { --c: 196,90,80;   --img-warm: 220,128,98;  --img-mid: 160,72,62;  --img-deep: 60,24,22;  --name: rgba(244,200,178,0.92); --inv: #efc9b6; --cyc: 8.4s; }
    .ebubble[data-glimpse="3"] { --c: 232,138,62;  --img-warm: 248,170,98;  --img-mid: 220,128,58; --img-deep: 64,30,14;  --name: rgba(252,222,180,0.92); --inv: #f8cda0; --cyc: 6.8s; }
    .ebubble[data-glimpse="4"] { --c: 210,224,236; --img-warm: 232,242,250; --img-mid: 160,185,200; --img-deep: 38,50,60;  --name: rgba(238,246,252,0.94); --inv: #f0f4f8; --cyc: 9.2s; }
    .ebubble[data-glimpse="5"] { --c: 196,142,86;  --img-warm: 220,168,108; --img-mid: 168,108,68; --img-deep: 56,32,18;  --name: rgba(244,212,178,0.94); --inv: #ecc9a4; --cyc: 8.0s; }
    .ebubble[data-glimpse="6"] { --c: 130,186,214; --img-warm: 150,205,228; --img-mid: 110,170,200; --img-deep: 18,38,50;  --name: rgba(204,230,244,0.94); --inv: #c8e2ee; --cyc: 7.9s; }

    .bubble-name-text {

  </style>
</head>

  <script>
    // Always start at the top on page load — Echo's opening sequence is a one-time arrival
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    window.addEventListener('load', function() {
      window.scrollTo(0, 0);
      // Defer aura breathing animations until after initial paint settles —
      // prevents heavy blur filters from blocking first-scroll responsiveness
      setTimeout(function() {
        document.body.classList.add('auras-on');
      }, 1200);
    });
    window.addEventListener('beforeunload', function() {
      window.scrollTo(0, 0);
    });
  </script>

  <script>
    (function() {
      const stage = document.getElementById('echoStage');
      const navMark = document.getElementById('navMark');
      const orbUp = document.getElementById('orbUp');
      const orbDown = document.getElementById('orbDown');
      const signalWrap = document.getElementById('signalWrap');
      const fieldContinuous = document.querySelector('.field-continuous');
      let dissolved = false;
      let orbDownTracking = false;
      let orbDownStartTop = 0;

      // Sync the field's height to the document height so it spans the full page
      function syncFieldHeight() {
        if (fieldContinuous) {
          const h = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight,
            document.documentElement.clientHeight
          );
          fieldContinuous.style.height = h + 'px';
        }
      }
      syncFieldHeight();
      window.addEventListener('load', syncFieldHeight);
      window.addEventListener('resize', syncFieldHeight);
      setTimeout(syncFieldHeight, 100);
      // Expose so the glimpse IIFE can resync after blooms expand/collapse the document
      window.__echoSyncField = syncFieldHeight;

      function getCenters() {
        const sigRect = signalWrap.getBoundingClientRect();
        const navRect = navMark.getBoundingClientRect();
        const scrollTop = getTrueScrollTop();
        return {
          sigX: sigRect.left + sigRect.width / 2,
          sigY: sigRect.top + sigRect.height / 2 + scrollTop,
          navX: navRect.left + navRect.width / 2,
          navY: navRect.top + navRect.height / 2 + scrollTop,
          viewportWidth: window.innerWidth,
          viewportHeight: window.innerHeight
        };
      }

      // Viewport-coordinate accessors for the orb-up flight
      function getSignalViewport() {
        const r = signalWrap.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
      function getNavViewport() {
        const r = navMark.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }

      function animateOrbUp() {
        // Capture only the START position (the signal at flight start) — the END
        // (the nav) is recalculated every frame so the orb tracks the nav even
        // when scroll is happening during the flight.
        const sig = getSignalViewport();
        const startX = sig.x;
        const startY = sig.y;
        orbUp.style.transform = 'translate3d(' + (startX - 11) + 'px, ' + (startY - 11) + 'px, 0)';
        orbUp.style.opacity = '0';
        const duration = 1700;
        const startTime = performance.now();
        function frame(now) {
          const t = Math.min((now - startTime) / duration, 1);
          // Cubic ease-out: fast start, smooth deceleration into the dots
          const eased = 1 - Math.pow(1 - t, 3);
          const navNow = getNavViewport();
          const endX = navNow.x;
          const endY = navNow.y;
          const ctrlX = startX + (endX - startX) * 0.4;
          const ctrlY = Math.min(startY, endY) - 50;
          const omt = 1 - eased;
          const x = omt * omt * startX + 2 * omt * eased * ctrlX + eased * eased * endX;
          const y = omt * omt * startY + 2 * omt * eased * ctrlY + eased * eased * endY;
          orbUp.style.transform = 'translate3d(' + (x - 11) + 'px, ' + (y - 11) + 'px, 0)';
          let op;
          if (t < 0.08) op = t / 0.08;
          else if (t > 0.92) op = (1 - t) / 0.08;
          else op = 1;
          orbUp.style.opacity = String(op);
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            orbUp.style.opacity = '0';
            navMark.classList.add('seeded');
            navMark.classList.add('receiving');
            setTimeout(function() { navMark.classList.remove('receiving'); }, 1400);
          }
        }
        requestAnimationFrame(frame);
      }

      function startOrbDown(c) {
        orbDownTracking = true;
        orbDownStartTop = c.sigY;
        orbDown.style.left = (c.sigX - 20) + 'px';
        orbDown.style.top = (c.sigY - 20) + 'px';
        orbDown.style.opacity = '0';
        orbDown.classList.add('alive');
        const fadeStart = performance.now();
        function fadeIn(now) {
          const t = Math.min((now - fadeStart) / 700, 1);
          orbDown.style.opacity = String(t * 0.9);
          if (t < 1) requestAnimationFrame(fadeIn);
        }
        requestAnimationFrame(fadeIn);
        ensureRafRunning();
      }

      // The orb-down's path threads around the bubbles by pre-computed bypass sides.
      // Each bubble has a `data-bypass-side` of 'left' or 'right' indicating which side
      // of the bubble the orb passes by. Path is built dynamically so that resizes /
      // bubble repositions are handled.
      const BYPASS_OFFSET = 220;

      // Cache for bubble positions — invalidated when scroll/resize happens.
      // Avoids triggering layout reflow on every animation frame.
      let cachedBubblePositions = null;
      let cachedBubblePositionsAtScroll = -1;
      function getBubbleAbsolutePositions() {
        const scrollTop = getTrueScrollTop();
        if (cachedBubblePositions !== null && Math.abs(cachedBubblePositionsAtScroll - scrollTop) < 5) {
          return cachedBubblePositions;
        }
        const bubbles = document.querySelectorAll('.ebubble');
        const positions = [];
        bubbles.forEach(function(b) {
          const r = b.getBoundingClientRect();
          const bypassSide = b.dataset.bypassSide ||
            (parseFloat(b.style.left) < 50 ? 'right' : 'left');
          positions.push({
            cx: r.left + r.width / 2,
            cy: r.top + r.height / 2 + scrollTop,
            bypassSide: bypassSide
          });
        });
        positions.sort(function(a, b) { return a.cy - b.cy; });
        cachedBubblePositions = positions;
        cachedBubblePositionsAtScroll = scrollTop;
        return positions;
      }

      function buildBypassPath() {
        const viewportW = window.innerWidth;
        const bubbles = getBubbleAbsolutePositions();
        const waypoints = [];
        // Start at the signal location (where the orb spawned)
        waypoints.push({
          cx: viewportW * 0.5,
          cy: orbDownStartTop
        });
        // One waypoint per bubble, offset to the bypass side
        bubbles.forEach(function(b) {
          const bypassX = b.bypassSide === 'right' ? b.cx + BYPASS_OFFSET : b.cx - BYPASS_OFFSET;
          const clampedX = Math.max(60, Math.min(viewportW - 60, bypassX));
          waypoints.push({ cx: clampedX, cy: b.cy });
        });
        // Now: the seventh-as-waypoint and the journey to Subscribe.
        // - seventh-rest: above the seventh (this is the first rest stop)
        // - seventh-side: curving out to the right of the seventh's expanded radius
        // - subscribe-rest: beside the Subscribe form (the second/final rest stop)
        const seventhEl = document.getElementById('seventh');
        const subscribeEl = document.getElementById('subscribeSection');
        if (seventhEl) {
          const sr = seventhEl.getBoundingClientRect();
          const scrollTop = getTrueScrollTop();
          const seventhCenterX = sr.left + sr.width / 2;
          const seventhCenterY = sr.top + scrollTop + sr.height / 2;
          // Rest 1: 280px above the seventh's top edge. The seventh expands to
          // scale 1.55 (top edge moves up ~184px); 280 - 184 = 96px clearance.
          const seventhRestY = sr.top + scrollTop - 280;
          waypoints.push({
            cx: seventhCenterX,
            cy: seventhRestY,
            isRest: true,
            restType: 'seventh'
          });
          // Curve right around the seventh's expanded radius (~400px from center).
          // Two waypoints to make the curve feel deliberate, not an overshoot:
          //   - east waypoint at the seventh's vertical midpoint, far right
          //   - clearance waypoint past the seventh's bottom, gentler X
          const eastX = Math.min(viewportW - 60, seventhCenterX + 460);
          waypoints.push({
            cx: eastX,
            cy: seventhCenterY
          });
          const clearanceY = sr.top + scrollTop + sr.height + 200;
          const clearanceX = Math.min(viewportW - 80, seventhCenterX + 320);
          waypoints.push({
            cx: clearanceX,
            cy: clearanceY
          });
          // Rest 2: at the Subscribe form, left of center.
          if (subscribeEl) {
            const subRect = subscribeEl.getBoundingClientRect();
            const subAbsTop = subRect.top + scrollTop;
            const subscribeRestX = viewportW * 0.5 - 200;
            const subscribeRestY = subAbsTop + subRect.height * 0.45;
            waypoints.push({
              cx: subscribeRestX,
              cy: subscribeRestY,
              isRest: true,
              restType: 'subscribe'
            });
          }
        } else if (bubbles.length > 0) {
          const last = bubbles[bubbles.length - 1];
          const exitX = last.bypassSide === 'right' ? viewportW * 0.65 : viewportW * 0.35;
          waypoints.push({ cx: exitX, cy: last.cy + 600 });
        }
        return waypoints;
      }

      // The orb-down's path now has TWO rest stops: above the seventh, and beside
      // Subscribe. Between them is a curve to the right around the seventh.
      // The orb settles visually whenever it's at either rest waypoint.
      // 'idle' = wandering through glimpses
      // 'seventh' = settled above the seventh (larger glow)
      // 'subscribe' = settled at the Subscribe form (slightly smaller, intimate)
      let restState = 'idle';

      function setRestState(newState) {
        if (restState === newState) return;
        orbDown.classList.remove('alive', 'settled', 'subscribed');
        if (newState === 'idle') orbDown.classList.add('alive');
        else if (newState === 'seventh') orbDown.classList.add('settled');
        else if (newState === 'subscribe') orbDown.classList.add('subscribed');
        restState = newState;
      }

      function updateOrbDownPosition() {
        if (!orbDownTracking) return;
        const c = getCenters();
        const scrollTop = getTrueScrollTop();
        const viewportH = c.viewportHeight;

        // The orb sits at 55% of the viewport while scrolling.
        // When near the top (spawn point still in view), park near where it spawned.
        let driftVisibleY = viewportH * 0.55;
        const spawnVisibleY = orbDownStartTop - scrollTop;
        if (spawnVisibleY > 0 && spawnVisibleY < viewportH) {
          driftVisibleY = Math.max(driftVisibleY, spawnVisibleY + 80);
        }

        const targetAbsoluteY = scrollTop + driftVisibleY;

        const waypoints = buildBypassPath();
        const lastWaypoint = waypoints[waypoints.length - 1];

        // CLAMP: never let the orb's path target go past the final waypoint.
        const clampedTargetY = Math.min(targetAbsoluteY, lastWaypoint.cy);

        // Find the path segment for the clamped target
        let prev = waypoints[0];
        let next = waypoints[waypoints.length - 1];
        let prevIdx = 0;
        let nextIdx = waypoints.length - 1;
        for (let i = 0; i < waypoints.length - 1; i++) {
          if (clampedTargetY >= waypoints[i].cy && clampedTargetY <= waypoints[i + 1].cy) {
            prev = waypoints[i];
            next = waypoints[i + 1];
            prevIdx = i;
            nextIdx = i + 1;
            break;
          }
        }
        if (clampedTargetY < waypoints[0].cy) {
          prev = waypoints[0];
          next = waypoints[1] || waypoints[0];
          prevIdx = 0;
          nextIdx = 1;
        }

        // Eased interpolation between waypoints
        const span = next.cy - prev.cy;
        const segT = span > 0 ? Math.max(0, Math.min(1, (clampedTargetY - prev.cy) / span)) : 0;
        const easedT = segT < 0.5 ? 2 * segT * segT : 1 - Math.pow(-2 * segT + 2, 2) / 2;
        const baseX = prev.cx + (next.cx - prev.cx) * easedT;
        const baseY = prev.cy + (next.cy - prev.cy) * easedT;

        // Determine rest state.
        // Two rest waypoints exist (seventh-rest and subscribe-rest), each with isRest=true.
        // The orb is "at" a rest waypoint when:
        //   - the segment ENDS at it AND segT > 0.85 (approaching from above), OR
        //   - the segment STARTS at it AND segT < 0.15 (moving away from below)
        // The "at rest near a waypoint" detection lets us settle visually
        // smoothly even when the orb is briefly slightly past it.
        let nearestRestType = null;
        let nearestRestProximity = 0; // 0 = far, 1 = at rest
        if (next.isRest && segT >= 0.7) {
          // Approaching this rest waypoint from above
          nearestRestType = next.restType;
          nearestRestProximity = (segT - 0.7) / 0.3;
        } else if (prev.isRest && segT <= 0.3) {
          // Just left this rest waypoint, moving downward
          nearestRestType = prev.restType;
          nearestRestProximity = 1 - (segT / 0.3);
        }

        // Apply rest state with hysteresis to avoid flicker
        if (nearestRestProximity >= 0.6 && nearestRestType) {
          setRestState(nearestRestType);
        } else if (nearestRestProximity < 0.3) {
          setRestState('idle');
        }

        const time = performance.now() / 1000;
        const wanderAmt = 1 - Math.max(0, Math.min(1, nearestRestProximity));
        const wobbleX = (Math.sin(time * 0.5) * 16 + Math.sin(time * 1.1) * 6) * wanderAmt +
                        (Math.sin(time * 0.3) * 5) * (1 - wanderAmt);
        const wobbleY = (Math.cos(time * 0.4) * 12 + Math.cos(time * 0.9) * 5) * wanderAmt +
                        (Math.cos(time * 0.35) * 4) * (1 - wanderAmt);

        let absoluteX = baseX + wobbleX;
        let absoluteY = baseY + wobbleY;
        // Convert to viewport-relative for clamping (avoid clipping at edges)
        const visibleY = absoluteY - scrollTop;
        const clampedVisibleY = Math.max(60, Math.min(viewportH - 60, visibleY));
        absoluteY = scrollTop + clampedVisibleY;
        absoluteX = Math.max(40, Math.min(c.viewportWidth - 40, absoluteX));

        orbDown.style.top = (absoluteY - 20) + 'px';
        orbDown.style.left = (absoluteX - 20) + 'px';
      }

      // Recognition pulse — fired when the form is submitted successfully.
      // The orb-down briefly flares larger, then returns to its subscribed state.
      window.__echoOrbRecognition = function() {
        orbDown.classList.add('recognition');
        setTimeout(function() { orbDown.classList.remove('recognition'); }, 1400);
      };

      // Scroll-position-based dissolve / return.
      // - First scroll past 8px: birth the fairy orbs (one-time).
      // - Scroll past 40% of viewport: signal contracts to dissolved state.
      // - Scroll back above 40%: signal returns.
      let signalSpawned = false;

      // Returns the true scroll position by checking all possible scroll containers.
      // Different browsers/configurations scroll on document.documentElement vs document.body
      // vs window itself. We take whichever is actually moving.
      function getTrueScrollTop() {
        const a = window.scrollY || 0;
        const b = window.pageYOffset || 0;
        const c = document.documentElement ? document.documentElement.scrollTop || 0 : 0;
        const d = document.body ? document.body.scrollTop || 0 : 0;
        return Math.max(a, b, c, d);
      }

      function pollScrollState() {
        const scrollTop = getTrueScrollTop();
        const viewportH = window.innerHeight;
        const dissolveThreshold = viewportH * 0.4;

        if (scrollTop > 8 && !signalSpawned) {
          signalSpawned = true;
          // Defer the heavy spawn work so it doesn't block the first scroll frame
          requestAnimationFrame(function() {
            const c = getCenters();
            animateOrbUp();
            startOrbDown(c);
          });
        }

        if (scrollTop > dissolveThreshold) {
          if (!dissolved) {
            dissolved = true;
            stage.classList.remove('returning');
            stage.classList.add('dissolving');
          }
        } else {
          if (dissolved) {
            dissolved = false;
            stage.classList.remove('dissolving');
            stage.classList.add('returning');
          }
        }

        // Misted gradient warming — imperceptible.
        // Anchor points (in absolute pixels):
        //   - 0 to 1 viewport: warm = 0
        //   - 1 viewport to seventh-anchor: warm eases from 0 to 1
        //   - seventh-anchor to past-seventh: warm holds at 1
        //   - past-seventh through Subscribe/footer: warm eases back to ~0.75
        updateGradientWarming(scrollTop, viewportH);
      }

      const fieldWarm = document.getElementById('fieldWarm');
      function updateGradientWarming(scrollTop, viewportH) {
        const seventhEl = document.getElementById('seventh');
        const subscribeEl = document.getElementById('subscribeSection');
        if (!seventhEl) return;

        const sr = seventhEl.getBoundingClientRect();
        const seventhAbsY = sr.top + scrollTop;

        const startWarm = viewportH;        // begin warming after first viewport
        const peakWarm = seventhAbsY;       // peak at the seventh's top
        let opacity;

        if (scrollTop < startWarm) {
          opacity = 0;
        } else if (scrollTop < peakWarm) {
          // Ease from 0 to 1 across this stretch
          const t = (scrollTop - startWarm) / Math.max(1, peakWarm - startWarm);
          // Smooth ease-in
          opacity = t * t * (3 - 2 * t);
        } else {
          // Past the seventh — held at peak, ease back slightly through Subscribe
          if (subscribeEl) {
            const subRect = subscribeEl.getBoundingClientRect();
            const subAbsY = subRect.top + scrollTop;
            if (scrollTop < subAbsY) {
              opacity = 1;
            } else {
              // Ease from 1 to 0.78 from Subscribe top to bottom
              const subBottom = subAbsY + subRect.height;
              const t = Math.min(1, (scrollTop - subAbsY) / Math.max(1, subBottom - subAbsY));
              opacity = 1 - (t * 0.22);
            }
          } else {
            opacity = 1;
          }
        }

        if (fieldWarm) fieldWarm.style.opacity = String(opacity);
        document.body.style.setProperty('--warm-field-opacity', String(opacity));
      }

      // Click on the stage — direct dissolve trigger for users who tap
      function dissolveOnClick() {
        if (signalSpawned) return;
        signalSpawned = true;
        dissolved = true;
        const c = getCenters();
        stage.classList.add('dissolving');
        animateOrbUp();
        startOrbDown(c);
      }

      // Scroll listener kicks off polling — we still listen for scroll to be responsive,
      // but the rAF loop is the source of truth and runs continuously.
      // Listen on both window and document to catch whichever scroll target the browser uses.
      window.addEventListener('scroll', pollScrollState, { passive: true });
      document.addEventListener('scroll', pollScrollState, { passive: true });
      window.addEventListener('wheel', pollScrollState, { passive: true });
      window.addEventListener('touchmove', pollScrollState, { passive: true });

      // Click anywhere on the stage (except the nav) triggers the fairy orbs immediately
      stage.addEventListener('click', function(e) {
        if (e.target.closest('.nav-mark')) return;
        dissolveOnClick();
      });

      // Nav mark click is a no-op for now — Session C wires up the actual menu panel
      navMark.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      // The rAF loop only runs once orb-down is alive — it keeps the orb breathing
      // and wobbling continuously. Before spawn, scroll events alone drive everything.
      let rafRunning = false;
      function tickOrbDown() {
        if (orbDownTracking) {
          updateOrbDownPosition();
          requestAnimationFrame(tickOrbDown);
        } else {
          rafRunning = false;
        }
      }
      function ensureRafRunning() {
        if (!rafRunning && orbDownTracking) {
          rafRunning = true;
          requestAnimationFrame(tickOrbDown);
        }
      }

      // Set initial gradient warming state on load
      window.addEventListener('load', function() {
        pollScrollState();
      });
    })();

    /* Session C — navigation panel, Sol thread, subscribe form */
    (function() {

      let closeTimer = null;
      const PROXIMITY_OPEN = 80;
      const PROXIMITY_CLOSE = 120;

      function openPanel() {
        if (closeTimer) {

        const top    = m.top - 10;
        const bottom = p ? Math.max(m.bottom, p.bottom) + 10 : m.bottom + 10;
        const dx = Math.max(left - x, 0, x - right);

          }

    })();

          shape: 'M 240,24 C 342,28 436,90 436,212 C 432,304 384,402 290,436 C 208,468 102,438 54,360 C 6,278 24,168 90,100 C 138,50 188,24 240,24 Z',
          grad: { cx: 56, cy: 58 }
        },
        {
          name: 'presence and consciousness',
          title: 'You are a being the universe created that no measure can recreate.',
          passage: 'Awareness moving through a body in time. The ineffable fact of being here at all — knowing you are knowing, sensing you are sensing, born to a living, breathing world. And underneath it all, the silence from which everything you have ever noticed has arrived. This is the deepest mystery available to you, and you are it. No model recombines its way into this. No system arrives here from the outside. It is the one thing that is only ever lived from within.',
          closing: 'This is consciousness. It is what makes you whole.',
          invitation: 'With intention, sit somewhere quiet today. Breathe in and notice fully. You are here.',
          shape: 'M 240,30 C 336,28 432,92 436,210 C 440,308 394,402 298,436 C 212,468 110,448 62,372 C 14,294 22,180 80,108 C 126,54 184,30 240,30 Z',
          grad: { cx: 50, cy: 50 }
        },
        {
          name: 'vitality and the body',
          title: 'Everything you have ever felt, you felt here.',
          passage: 'It asks for so little. Movement. Food. Water. Light. Rest. Tend to it, and it returns you to a day fully lived — to the capacity to feel what is in front of you, to the aliveness that is the ground of everything else on this page. The body is not a vehicle you happen to be inside. It is the place where being alive actually happens.',
          closing: 'This is vitality. It is one of the things that makes you whole.',
          invitation: 'One small kindness today, offered to the body that has been carrying you.',
          shape: 'M 240,32 C 338,30 430,96 434,214 C 438,304 390,400 296,436 C 212,464 110,442 60,368 C 12,290 22,178 84,104 C 130,52 186,32 240,32 Z',
          grad: { cx: 52, cy: 56 }
        },
        {
          name: 'sovereignty',
          title: 'The path is not behind you. It is through.',
          passage: 'The intelligence you are building can be a conduit. A medium. Something that carries what you are doing further than you could carry it alone. Let it do what it is good at. And keep — protect, practice, return to — the part of you that no conduit can replicate. The body. The breath. The presence. The capacity to sit with a hard question long enough to be changed by it. The recognition of what is genuinely new, which only consciousness in living form can sense.',
          closing: 'This is sovereignty. It is what keeps the rest of you whole.',
          invitation: 'Let the conduit carry what it can. Stay the one who chooses.',
          shape: 'M 240,28 C 340,24 432,90 432,212 C 440,308 390,406 296,436 C 210,464 102,438 50,362 C 8,288 24,168 88,100 C 134,52 188,28 240,28 Z',
          grad: { cx: 50, cy: 50 }
        }
      ];

      // Build each bubble's SVG content
      bubbleNodes.forEach(function(b, i) {
        const num = i + 1;
        const d = data[i];
        const auraGradId = 'aura-grad-' + num;
        const imgGradId = 'img-grad-' + num;
        const clipId = 'clip-' + num;

        b.innerHTML =
          '<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid meet">' +
            '<defs>' +
              '<radialGradient id="' + auraGradId + '" cx="50%" cy="50%" r="50%">' +
                '<stop offset="0%" stop-color="rgb(var(--c))" stop-opacity="1"/>' +
                '<stop offset="30%" stop-color="rgb(var(--c))" stop-opacity="0.78"/>' +
                '<stop offset="60%" stop-color="rgb(var(--c))" stop-opacity="0.32"/>' +
                '<stop offset="100%" stop-color="rgb(var(--c))" stop-opacity="0"/>' +
              '</radialGradient>' +
              '<radialGradient id="' + imgGradId + '" cx="' + d.grad.cx + '%" cy="' + d.grad.cy + '%" r="62%">' +
                '<stop offset="0%" stop-color="rgb(var(--img-warm))" stop-opacity="0.95"/>' +
                '<stop offset="35%" stop-color="rgb(var(--img-mid))" stop-opacity="0.78"/>' +
                '<stop offset="70%" stop-color="rgb(var(--img-deep))" stop-opacity="0.92"/>' +
                '<stop offset="100%" stop-color="rgb(var(--img-deep))" stop-opacity="1"/>' +
              '</radialGradient>' +
              '<clipPath id="' + clipId + '"><path d="' + d.shape + '"/></clipPath>' +
            '</defs>' +
            '<g class="aura-far">' +
              '<circle cx="240" cy="240" r="320" fill="url(#' + auraGradId + ')" filter="url(#aura-blur-far)" opacity="0.85"/>' +
            '</g>' +
            '<g class="aura-mid">' +
              '<circle cx="240" cy="240" r="270" fill="url(#' + auraGradId + ')" filter="url(#aura-blur-mid)" opacity="0.92"/>' +
            '</g>' +
            '<g class="aura-near">' +
              '<circle cx="240" cy="240" r="225" fill="url(#' + auraGradId + ')" filter="url(#aura-blur-near)"/>' +
            '</g>' +
            '<g clip-path="url(#' + clipId + ')">' +
              '<rect x="0" y="0" width="480" height="480" fill="url(#' + imgGradId + ')" filter="url(#bub-blur-rest)" class="bubble-image-rest"/>' +
              '<rect x="0" y="0" width="480" height="480" fill="url(#' + imgGradId + ')" filter="url(#bub-blur-clear)" class="bubble-image-clear" opacity="0"/>' +
            '</g>' +
            '<text class="bubble-name-text" x="240" y="424" text-anchor="middle">' + d.name + '</text>' +
            '<foreignObject class="bubble-content-fo" x="0" y="0" width="480" height="480">' +
              '<div class="bubble-content-inner" xmlns="http://www.w3.org/1999/xhtml">' +
                '<p class="bubble-title-line">' + d.title + '</p>' +
                '<p class="bubble-passage-line">' + d.passage + '</p>' +
                '<p class="bubble-closing-line">' + d.closing + '</p>' +
                '<p class="bubble-invitation-label">the invitation</p>' +
                '<p class="bubble-invitation-line">' + d.invitation + '</p>' +
              '</div>' +
            '</foreignObject>' +
          '</svg>';

        const restImg = b.querySelector('.bubble-image-rest');
        const clearImg = b.querySelector('.bubble-image-clear');
        if (restImg) restImg.style.transition = 'opacity 0.7s cubic-bezier(0.22,0.61,0.36,1)';
        if (clearImg) clearImg.style.transition = 'opacity 0.7s cubic-bezier(0.22,0.61,0.36,1)';

        // Sample the bubble's clip-path to know its rim distance at every angle.
        // This drives the collapse-on-rim-cross logic — collapse fires when the cursor
        // crosses the actual visible bubble outline, accounting for the organic shape.
        const path = b.querySelector('clipPath path');
        if (path) {
          const samples = [];
          const len = path.getTotalLength();
          for (let s = 0; s < 64; s++) {
            const pt = path.getPointAtLength((s / 64) * len);
            const dx = pt.x - 240;
            const dy = pt.y - 240;
            samples.push({ angle: Math.atan2(dy, dx), dist: Math.sqrt(dx*dx + dy*dy) });
          }
          samples.sort(function(a, b) { return a.angle - b.angle; });
          b._rimSamples = samples;
        }
      });

      function rimDistanceAtAngle(b, angle) {
        const samples = b._rimSamples;
        if (!samples) return 215;
        let lo = samples[samples.length - 1];
        let hi = samples[0];
        for (let i = 0; i < samples.length; i++) {
          if (samples[i].angle > angle) {
            hi = samples[i];
            lo = samples[(i - 1 + samples.length) % samples.length];
            break;
          }
        }
        return (lo.dist + hi.dist) / 2;
      }

      const REST_RADIUS = 90;
      const REST_ENTER_PROXIMITY = 90;
      let activeBubble = null;

      function getBubbleCenter(b) {
        const r = b.getBoundingClientRect();
        return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
      }

      function expand(b) {
        if (activeBubble && activeBubble !== b) collapse(activeBubble);
        b.classList.add('expanded');
        const restImg = b.querySelector('.bubble-image-rest');
        const clearImg = b.querySelector('.bubble-image-clear');
        if (restImg) restImg.style.opacity = '0';
        if (clearImg) clearImg.style.opacity = '1';
        activeBubble = b;
      }

      function collapse(b) {
        b.classList.remove('expanded');
        const restImg = b.querySelector('.bubble-image-rest');
        const clearImg = b.querySelector('.bubble-image-clear');
        if (restImg) restImg.style.opacity = '1';
        if (clearImg) clearImg.style.opacity = '0';
        if (activeBubble === b) activeBubble = null;
      }

      // Cursor proximity — expand on approach, collapse the moment the cursor crosses the rim
      document.addEventListener('mousemove', function(e) {
        if (activeBubble) {
          const c = getBubbleCenter(activeBubble);
          const dx = e.clientX - c.cx;
          const dy = e.clientY - c.cy;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const angle = Math.atan2(dy, dx);
          const rim = rimDistanceAtAngle(activeBubble, angle);
          if (dist > rim) {
            // Cursor left the rim — check if it's heading toward another bubble's proximity zone
            let nextBubble = null;
            let nextDist = Infinity;
            bubbleNodes.forEach(function(b) {
              if (b === activeBubble) return;
              const cc = getBubbleCenter(b);
              const ddx = e.clientX - cc.cx;
              const ddy = e.clientY - cc.cy;
              const d = Math.sqrt(ddx*ddx + ddy*ddy);
              const proximityToRest = d - REST_RADIUS;
              if (proximityToRest < nextDist) { nextBubble = b; nextDist = proximityToRest; }
            });
            if (nextBubble && nextDist <= REST_ENTER_PROXIMITY) {
              collapse(activeBubble);
              expand(nextBubble);
            } else {
              collapse(activeBubble);
            }
          }
          return;
        }
        let closest = null;
        let closestDist = Infinity;
        bubbleNodes.forEach(function(b) {
          const c = getBubbleCenter(b);
          const ddx = e.clientX - c.cx;
          const ddy = e.clientY - c.cy;
          const d = Math.sqrt(ddx*ddx + ddy*ddy);
          const proximityToRest = d - REST_RADIUS;
          if (proximityToRest < closestDist) { closest = b; closestDist = proximityToRest; }
        });
        if (closest && closestDist <= REST_ENTER_PROXIMITY) expand(closest);
      });

      // Click toggles — primary affordance on touch devices
      bubbleNodes.forEach(function(b) {
        b.addEventListener('click', function() {
          if (b.classList.contains('expanded')) collapse(b);
          else expand(b);
        });
      });

      // Build the seventh — same SVG construction as a bubble, but its own
      // content, larger expansion target, slower timing, and own proximity logic.
      // The aura is RAINBOW: six radial gradients positioned around the bubble's
      // perimeter, each in one of the six glimpse colors, blending softly together.
      // This makes the seventh visually carry all six teachings at once.
      const seventh = document.getElementById('seventh');
      if (seventh) {
        const sevenData = {
          name: 'the seventh',
          title: 'Six things that have always been yours.',
          passage: 'Natural rhythm. Love and connection. Movement and creativity. Presence and consciousness. Vitality in the body. Sovereignty over the tools you build. None of them given to you by anyone. None of them taken by what is being built. They are still yours, every one of them.',
          closing: 'It is an inheritance you can still claim.',
          invitation: 'Step through.',
          shape: 'M 240,28 C 340,28 432,96 436,212 C 440,310 390,402 294,436 C 208,464 108,442 58,366 C 8,286 22,170 86,100 C 132,50 188,28 240,28 Z',
          grad: { cx: 50, cy: 50 }
        };

        // The six glimpse field colors — same RGB values as the .ebubble[data-glimpse=N] --c
        const rainbowColors = [
          { r: 232, g: 178, b: 92,  angle: 270 },  // 1 rhythms — top, gold
          { r: 196, g: 90,  b: 80,  angle: 330 },  // 2 love — upper right, red
          { r: 232, g: 138, b: 62,  angle: 30  },  // 3 creativity — lower right, orange
          { r: 210, g: 224, b: 236, angle: 90  },  // 4 presence — bottom, silver-white
          { r: 196, g: 142, b: 86,  angle: 150 },  // 5 vitality — lower left, terra
          { r: 130, g: 186, b: 214, angle: 210 }   // 6 sovereignty — upper left, steel-cyan
        ];

        const auraGradId = 'aura-grad-7';
        const imgGradId = 'img-grad-7';
        const clipId = 'clip-7';

        // Build the rainbow aura defs — one radial gradient per glimpse color,
        // each positioned at its angle around the bubble's outer rim
        let rainbowDefs = '';
        let rainbowCircles = { far: '', mid: '', near: '' };
        rainbowColors.forEach(function(col, i) {
          const gid = 'aura-rainbow-' + i;
          // Convert angle to position — center of gradient sits on the perimeter
          const rad = (col.angle - 90) * Math.PI / 180; // -90 so 0deg = top
          const cxPct = 50 + Math.cos(rad) * 38;
          const cyPct = 50 + Math.sin(rad) * 38;
          rainbowDefs +=
            '<radialGradient id="' + gid + '" cx="' + cxPct + '%" cy="' + cyPct + '%" r="42%">' +
              '<stop offset="0%" stop-color="rgb(' + col.r + ',' + col.g + ',' + col.b + ')" stop-opacity="0.85"/>' +
              '<stop offset="40%" stop-color="rgb(' + col.r + ',' + col.g + ',' + col.b + ')" stop-opacity="0.5"/>' +
              '<stop offset="80%" stop-color="rgb(' + col.r + ',' + col.g + ',' + col.b + ')" stop-opacity="0.12"/>' +
              '<stop offset="100%" stop-color="rgb(' + col.r + ',' + col.g + ',' + col.b + ')" stop-opacity="0"/>' +
            '</radialGradient>';
          // Same circle structure as standard aura, one per color, each at slightly different radii
          rainbowCircles.far  += '<circle cx="240" cy="240" r="320" fill="url(#' + gid + ')" opacity="0.65"/>';
          rainbowCircles.mid  += '<circle cx="240" cy="240" r="270" fill="url(#' + gid + ')" opacity="0.78"/>';
          rainbowCircles.near += '<circle cx="240" cy="240" r="225" fill="url(#' + gid + ')" opacity="0.82"/>';
        });

        seventh.innerHTML =
          '<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid meet">' +
            '<defs>' +
              rainbowDefs +
              '<radialGradient id="' + imgGradId + '" cx="' + sevenData.grad.cx + '%" cy="' + sevenData.grad.cy + '%" r="62%">' +
                '<stop offset="0%" stop-color="rgb(var(--img-warm))" stop-opacity="0.95"/>' +
                '<stop offset="35%" stop-color="rgb(var(--img-mid))" stop-opacity="0.78"/>' +
                '<stop offset="70%" stop-color="rgb(var(--img-deep))" stop-opacity="0.92"/>' +
                '<stop offset="100%" stop-color="rgb(var(--img-deep))" stop-opacity="1"/>' +
              '</radialGradient>' +
              '<clipPath id="' + clipId + '"><path d="' + sevenData.shape + '"/></clipPath>' +
            '</defs>' +
            '<g class="aura-far" filter="url(#aura-blur-far)">' +
              rainbowCircles.far +
            '</g>' +
            '<g class="aura-mid" filter="url(#aura-blur-mid)">' +
              rainbowCircles.mid +
            '</g>' +
            '<g class="aura-near" filter="url(#aura-blur-near)">' +
              rainbowCircles.near +
            '</g>' +
            '<g clip-path="url(#' + clipId + ')">' +
              '<rect x="0" y="0" width="480" height="480" fill="url(#' + imgGradId + ')" filter="url(#bub-blur-rest)" class="bubble-image-rest"/>' +
              '<rect x="0" y="0" width="480" height="480" fill="url(#' + imgGradId + ')" filter="url(#bub-blur-clear)" class="bubble-image-clear" opacity="0"/>' +
            '</g>' +
            '<text class="bubble-name-text" x="240" y="430" text-anchor="middle">' + sevenData.name + '</text>' +
            '<foreignObject class="bubble-content-fo" x="0" y="0" width="480" height="480">' +
              '<div class="bubble-content-inner" xmlns="http://www.w3.org/1999/xhtml">' +
                '<p class="bubble-title-line">' + sevenData.title + '</p>' +
                '<p class="bubble-passage-line">' + sevenData.passage + '</p>' +
                '<p class="bubble-closing-line">' + sevenData.closing + '</p>' +
                '<p class="bubble-invitation-label">the invitation</p>' +
                '<p class="bubble-invitation-line">' + sevenData.invitation + '</p>' +
              '</div>' +
            '</foreignObject>' +
          '</svg>';

        const restImg = seventh.querySelector('.bubble-image-rest');
        const clearImg = seventh.querySelector('.bubble-image-clear');
        if (restImg) restImg.style.transition = 'opacity 1s cubic-bezier(0.22,0.61,0.36,1)';
        if (clearImg) clearImg.style.transition = 'opacity 1s cubic-bezier(0.22,0.61,0.36,1)';

        // The seventh's expand/collapse — slower than the glimpses, larger proximity zone.
        let seventhExpanded = false;
        function expandSeventh() {
          if (seventhExpanded) return;
          seventhExpanded = true;
          seventh.classList.add('expanded');
          const r = seventh.querySelector('.bubble-image-rest');
          const c = seventh.querySelector('.bubble-image-clear');
          if (r) r.style.opacity = '0';
          if (c) c.style.opacity = '1';
        }
        function collapseSeventh() {
          if (!seventhExpanded) return;
          seventhExpanded = false;
          seventh.classList.remove('expanded');
          const r = seventh.querySelector('.bubble-image-rest');
          const c = seventh.querySelector('.bubble-image-clear');
          if (r) r.style.opacity = '1';
          if (c) c.style.opacity = '0';
        }

        // Cursor proximity for the seventh — wider zone than the glimpses
        const SEVENTH_PROXIMITY = 140;
        document.addEventListener('mousemove', function(e) {
          const rect = seventh.getBoundingClientRect();
          // Skip if the seventh is offscreen (don't compute on every frame when invisible)
          if (rect.bottom < 0 || rect.top > window.innerHeight) return;
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = e.clientX - cx;
          const dy = e.clientY - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          // Use the rest-state radius (~150) plus proximity zone
          const restRadius = rect.width * 0.5 * 0.62; // accounts for scale(0.62)
          if (dist < restRadius + SEVENTH_PROXIMITY) {
            expandSeventh();
          } else if (dist > restRadius + SEVENTH_PROXIMITY + 60) {
            collapseSeventh();
          }
        });
      }
    })();
  </script>
